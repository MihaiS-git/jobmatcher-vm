services:
  postgres:
    image: postgres:16-alpine
    container_name: jobmatcher-postgres
    env_file: .env
    environment:
      POSTGRES_DB: jobmatcher
      POSTGRES_USER: jobmatcher
      POSTGRES_PASSWORD: jobmatcher
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobmatcher"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  backend:
    build: src
    container_name: jobmatcher-backend
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
