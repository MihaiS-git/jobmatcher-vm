version: "3.9"

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
  grafana-data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: jobmatcher-postgres
    env_file: .env
    environment:
      POSTGRES_DB: jobmatcher
      POSTGRES_USER: jobmatcher
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobmatcher -d jobmatcher"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  backend:
    image: ghcr.io/mihais-git/jobmatcher-vm:latest
    container_name: jobmatcher-backend
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/liveness"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

    networks:
      - internal

  prometheus:
    image: prom/prometheus:v2.53.5
    container_name: jobmatcher-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - jobmatcher-backend
    networks:
      - internal

  grafana:
    image: grafana/grafana:10.4.2
    container_name: jobmatcher-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - internal
 
