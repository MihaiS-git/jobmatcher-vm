spring.application.name=server
server.port=8080

# PostgreSQL database configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/jobmatcherdbtest
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000

# JPA configuration
spring.jpa.hibernate.ddl-auto=create-drop
#spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true


# Logging
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF
logging.level.com.jobmatcher.server=OFF

# Spring DevTools
spring.devtools.livereload.enabled=false
spring.devtools.restart.enabled=false

# Spring Security default user credentials
spring.security.user.name=test_user
spring.security.user.password=test_password

# JWT configuration (test secret)
jwt.secret=mH3yT9WvB5Vh3fJ0mE6pF9OqP5kSxT1rB2VfA9sL0eY=
jwt.expiration.time=3600
jwt.refresh.token.expiration=1

# Disable OAuth2/Gmail/Stripe/Cloudinary for tests if not needed
spring.security.oauth2.client.registration.google.client-id=dummy
spring.security.oauth2.client.registration.google.client-secret=dummy

# Front end (dummy URLs)
frontend.url.prod=http://localhost:5173
frontend.url.dev=http://localhost:5173
frontend.url.built=http://localhost:5173
frontend.base.url=http://localhost:5173

# Max file upload size
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Stripe (dummy values)
stripe.api.key=test_stripe_key
stripe.webhook.secret=test_webhook_secret

# Cache bean overwriting
#spring.cache.type=none
spring.main.allow-bean-definition-overriding: true