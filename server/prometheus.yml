global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'jobmatcher-server'
    metrics_path: '/actuator/prometheus'
    scheme: 'http'
    basic_auth:
      username: '${ACTUATOR_USER}'
      password: '${ACTUATOR_PASSWORD}'
    static_configs:
      - targets:
          - jobmatcher-backend:8080

  - job_name: 'k6'
    static_configs:
      - targets:
          - k6:6565
